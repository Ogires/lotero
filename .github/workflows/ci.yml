name: CI

on:
  push:
    branches: [main, relanzamiento]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint y formato (Biome)
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
